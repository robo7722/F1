<html lang="de">

<title>F1 &amp; F2 · Zeiten in Deutschland</title>
<style>

:root[data-theme="dark"]{--bg:#0b0b0f;--card:#16161d;--card2:#1e1e28;--tx:#f2f2f5;--mut:#9a9aab;--ln:#2a2a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.5px}
h1 b{color:var(--f1)}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#e10600 0%,#7a0300 100%);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero.f2{background:linear-gradient(135deg,#2d7dff 0%,#112f73 100%)}
.hero small{opacity:.85;text-transform:uppercase;letter-spacing:1px;font-size:11px}
.hero .t{font-size:19px;font-weight:700;margin:4px 0}
.hero .d{opacity:.9;font-size:14px}
.cd{display:flex;gap:10px;margin-top:12px}
.cd div{background:rgba(0,0,0,.28);border-radius:10px;padding:8px 10px;min-width:58px;text-align:center}
.cd b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;text-transform:uppercase;opacity:.8}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.pri{background:var(--f1);border-color:var(--f1);color:#fff}
.sp{flex:1}
.gp{background:var(--card);border:1px solid var(--ln);border-radius:16px;margin-bottom:12px;overflow:hidden}
.gp h2{margin:0;padding:12px 14px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gp h2 span{font-size:12px;color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--ln)}
.row.past{opacity:.45}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;color:#fff;min-width:30px;text-align:center}
.tag.F1{background:var(--f1)}.tag.F2{background:var(--f2)}
.s{flex:1}.s b{display:block;font-size:15px}.s i{font-style:normal;font-size:12px;color:var(--mut)}
.tm{text-align:right;font-variant-numeric:tabular-nums}.tm b{display:block;font-size:17px}.tm span{font-size:12px;color:var(--mut)}
.ic{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 6px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab,.ch2{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.tab{flex:1}
.tab.on,.ch2.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.wx{padding:0 14px 12px;font-size:13px;color:var(--mut);line-height:1.5}.wx b{color:var(--tx)}
.nw{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.nw small{color:var(--mut);font-size:12px}.nw h3{margin:6px 0;font-size:16px}.nw p{margin:0;color:var(--mut);font-size:14px}
.pos{width:26px;font-weight:700;color:var(--mut)}
.dh{padding:6px 14px;font-size:12px;color:var(--mut);background:var(--card2);border-top:1px solid var(--ln);text-transform:uppercase;letter-spacing:.5px}
.nw h3 a{color:inherit;text-decoration:none}
.foot{color:var(--mut);font-size:12px;margin-top:18px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.sheet input,.sheet select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--card2);color:var(--tx);font-size:16px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1;border-radius:12px;padding:12px}
</style>
</head>

  </div>

</div>

  <label>Serie</label>

  <input id="fd" type="datetime-local">
  <div class="acts"><button class="btn" id="cancel">Abbrechen</button><button class="btn pri" id="save">Speichern</button></div>
</div></div>

function wIcon(c){return c===0?"☀️":c<=2?"⛅":c===3?"☁️":c<=48?"🌫️":c<=67?"🌧️":c<=77?"❄️":c<=82?"🌦️":"⛈️"}
function getJ(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
function nowT(){return new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",timeZone:TZ})+" Uhr"}
function loadStd(){var A="https://api.jolpi.ca/ergast/f1/current/";
  return Promise.all([getJ(A+"driverstandings.json"),getJ(A+"constructorstandings.json")]).then(function(x){
    var dl=x[0].MRData.StandingsTable.StandingsLists[0].DriverStandings,cl=x[1].MRData.StandingsTable.StandingsLists[0].ConstructorStandings,t=nowT();
    STD.f1d={s:"Formel 1 · Fahrer · live (Abruf "+t+")",r:dl.map(function(d){var c=d.Constructors||[];return[d.Driver.givenName+" "+d.Driver.familyName,c.length?c[c.length-1].name:"",+d.points]})};
    STD.f1t={s:"Formel 1 · Teams · live (Abruf "+t+")",r:cl.map(function(c){return[c.Constructor.name,"",+c.points]})};

function loadWx(){var gps={};ev.forEach(function(e){if(e.s==="F1"&&COORD[e.g])gps[e.g]=1});
  Object.keys(gps).forEach(function(g){var c=COORD[g];
    getJ("https://api.open-meteo.com/v1/forecast?latitude="+c[0]+"&longitude="+c[1]+"&hourly=temperature_2m,precipitation_probability,weathercode&timezone="+encodeURIComponent(TZ)+"&forecast_days=16").then(function(j){
      var H=j.hourly,o={};
      ev.forEach(function(e){if(e.g!==g||e.s!=="F1"||(e.n!=="Qualifying"&&e.n!=="Rennen"))return;
        var k=H.time.indexOf(toInput(e.t).slice(0,13)+":00");if(k<0)return;
        var pr=H.precipitation_probability[k];
        o[e.n==="Rennen"?"r":"q"]=wIcon(H.weathercode[k])+" "+Math.round(H.temperature_2m[k])+" °C, Regen "+(pr==null?"?":pr)+" %"});
      if(o.q||o.r){o.q=o.q||"–";o.r=o.r||"–";o.u=nowT();WXL[g]=o;stat("w",1);render()}}).catch(function(){if(!("w" in ST))stat("w",0)})})}
var ST={},STN={z:"Zeitplan",f1:"F1-Tabellen",f2:"F2-Tabellen",n:"News",w:"Wetter"};
function stat(k,ok){ST[k]=ok;var h=Object.keys(STN).filter(function(x){return x in ST}).map(function(x){return STN[x]+(ST[x]?" ✔ live":" ⚠ gespeichert")}).join(" · ");var el=$("st");if(el)el.textContent=h}
var CIRC={americas:"🇺🇸 USA (Austin)",rodriguez:"🇲🇽 Mexiko-Stadt",interlagos:"🇧🇷 São Paulo",vegas:"🇺🇸 Las Vegas",losail:"🇶🇦 Katar",yas_marina:"🇦🇪 Abu Dhabi"};
var SESS=[["FirstPractice","1. Freies Training"],["SecondPractice","2. Freies Training"],["ThirdPractice","3. Freies Training"],["SprintQualifying","Sprint-Qualifying"],["Sprint","Sprint"],["Qualifying","Qualifying"]];
function nearG(rt){var g=null;DEF.forEach(function(a){if(a[0]==="F1"&&a[2]==="Rennen"&&Math.abs(Date.parse(a[3])-rt)<2*864e5)g=a[1]});return g}
function loadSched(){return getJ("https://api.jolpi.ca/ergast/f1/current.json?limit=40").then(function(j){
  var R=j.MRData.RaceTable.Races,L=[],now=Date.now();
  function add(g,n,d,t){if(!d||!t)return;var ts=Date.parse(d+"T"+t);if(!isNaN(ts))L.push(mk(["F1",g,n,new Date(ts).toISOString()]))}
  R.forEach(function(r){var rt=Date.parse(r.date+"T"+(r.time||"")),g;if(isNaN(rt)||rt<now-4*864e5)return;
    g=CIRC[r.Circuit.circuitId]||nearG(rt)||("🏁 "+r.raceName);
    SESS.forEach(function(s){if(r[s[0]])add(g,s[1],r[s[0]].date,r[s[0]].time)});
    add(g,"Rennen",r.date,r.time)});
  if(!L.length)throw 0;
  var ids={};L.forEach(function(e){ids[e.id]=1});
  base=base.filter(function(e){return!(e.s==="F1"&&ids[e.id])}).concat(L);build();render();loadWx()})}
function nrm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function cellTxt(c){return c.textContent.replace(/\[[^\]]*\]/g,"").replace(/\s+/g," ").trim()}
function wikiRows(html,kind){var d=new DOMParser().parseFromString(html,"text/html"),best=[];
  Array.prototype.forEach.call(d.querySelectorAll("table.wikitable"),function(t){
    if(!t.rows.length||!/Pos/i.test(t.rows[0].textContent))return;
    var span=!!t.querySelector("td[rowspan],th[rowspan]"),out=[];
    Array.prototype.forEach.call(t.rows,function(r){var c=r.cells;if(c.length<3||!/^\d{1,2}$/.test(cellTxt(c[0])))return;
      if(kind==="t"&&span&&c[0].rowSpan<2)return;
      var nm=cellTxt(c[1]),pt=parseFloat(cellTxt(c[c.length-1]).replace(/[^\d.]/g,""));
      if(nm&&!isNaN(pt))out.push([nm,"",pt])});
    if(out.length>best.length)best=out});
  return best}
function goodRows(rows,min,ref){if(rows.length<min||rows[0][2]<ref)return false;for(var i=1;i<rows.length;i++)if(rows[i][2]>rows[i-1][2])return false;return true}

  return getJ(W+"&prop=sections").then(function(j){var ds=-1,ts=-1;

      if(ts<0&&/^Teams.{0,2}\s+(standings|championship)/i.test(l))ts=+s.index});
    if(ds<0)throw 0;
    return Promise.all([getJ(W+"&prop=text&section="+ds),ts>=0?getJ(W+"&prop=text&section="+ts):Promise.resolve(null)])}).then(function(x){
    var t=nowT(),ok=false,tm={};
    STD.f2d.r.forEach(function(r){tm[nrm(r[0])]=r[1]});
    var dr=wikiRows(x[0].parse.text,"d");
    if(goodRows(dr,10,STD.f2d.r[0][2])){STD.f2d={s:"Formel 2 · Fahrer · live (Wikipedia, Abruf "+t+")",r:dr.map(function(r){return[r[0],tm[nrm(r[0])]||"",r[2]]})};ok=true}
    if(x[1]){var tr=wikiRows(x[1].parse.text,"t");if(goodRows(tr,5,STD.f2t.r[0][2])){STD.f2t={s:"Formel 2 · Teams · live (Wikipedia, Abruf "+t+")",r:tr};ok=true}}
    if(!ok)throw 0;wmRender()})}
var NEWSL=null,NEWST="",fNews=new Intl.DateTimeFormat("de-DE",{timeZone:TZ,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
