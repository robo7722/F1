<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>F1 - Hub</title>
<style>
:root{--bg:#0b0b0f;--card:#16161d;--card2:#1e1e28;--tx:#f2f2f5;--mut:#9a9aab;--ln:#2a2a36;--f1:#e10600;--f2:#2d7dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3f6;--card:#fff;--card2:#ececf2;--tx:#14141a;--mut:#666678;--ln:#dcdce6}}
:root[data-theme="dark"]{--bg:#0b0b0f;--card:#16161d;--card2:#1e1e28;--tx:#f2f2f5;--mut:#9a9aab;--ln:#2a2a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.5px}
h1 b{color:var(--f1)}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.hero{background:#1b1b24;color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .bg{position:absolute;inset:-8px;background-size:cover;background-position:center;filter:blur(3.5px) saturate(1.1)}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.5))}
.hero .hc{position:relative;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.hero small{opacity:.85;text-transform:uppercase;letter-spacing:1px;font-size:11px}
.hero .t{font-size:19px;font-weight:700;margin:4px 0}
.hero .d{opacity:.9;font-size:14px}
.cd{display:flex;gap:10px;margin-top:12px}
.cd div{background:rgba(0,0,0,.28);border-radius:10px;padding:8px 10px;min-width:58px;text-align:center}
.cd b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;text-transform:uppercase;opacity:.8}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.pri{background:var(--f1);border-color:var(--f1);color:#fff}
.sp{flex:1}
.gp{background:var(--card);border:1px solid var(--ln);border-radius:16px;margin-bottom:12px;overflow:hidden}
.gp h2{margin:0;padding:12px 14px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gp h2 span{font-size:12px;color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--ln)}
.row.past{opacity:.45}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;color:#fff;min-width:30px;text-align:center}
.tag.F1{background:var(--f1)}.tag.F2{background:var(--f2)}
.s{flex:1}.s b{display:block;font-size:15px}.s i{font-style:normal;font-size:12px;color:var(--mut)}
.tm{text-align:right;font-variant-numeric:tabular-nums}.tm b{display:block;font-size:17px}.tm span{font-size:12px;color:var(--mut)}
.ic{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 6px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab,.ch2{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.tab{flex:1}
.tab.on,.ch2.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.wx{padding:0 14px 12px;font-size:13px;color:var(--mut);line-height:1.5}.wx b{color:var(--tx)}
.nw{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.nw small{color:var(--mut);font-size:12px}.nw h3{margin:6px 0;font-size:16px}.nw p{margin:0;color:var(--mut);font-size:14px}
.pos{width:26px;font-weight:700;color:var(--mut)}
.dh{padding:6px 14px;font-size:12px;color:var(--mut);background:var(--card2);border-top:1px solid var(--ln);text-transform:uppercase;letter-spacing:.5px}
.nw h3 a{color:inherit;text-decoration:none}
.foot{color:var(--mut);font-size:12px;margin-top:18px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.sheet input,.sheet select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--card2);color:var(--tx);font-size:16px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1;border-radius:12px;padding:12px}

.chip,.tab,.ch2{border:0;border-radius:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:9px 20px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.6px;font-size:13px;background:var(--card2);color:var(--tx)}
.tab{padding:10px 2px;font-size:11.5px;letter-spacing:0}
.chip.on,.tab.on,.ch2.on{background:var(--f1);color:#fff}
.logo{margin:2px 0 14px;line-height:0}
.logo img{height:40px;width:auto;display:block}
.gp{border-left:4px solid var(--f1)}
.gp h2{align-items:center}
.gt{font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.4px;font-size:16px}
.gt span{display:block;font-style:normal;text-transform:none;letter-spacing:0;margin-top:2px}
.trk{width:84px;height:50px;flex:none}
.row .trk{width:64px;height:38px}
.trk path{fill:none;stroke:var(--tx);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.9}
.ny{margin:30px 0 12px}
.ny .chk{height:12px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/12px 12px;border-radius:2px}
.ny h2{margin:12px 0 2px;font-size:24px;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.ny h2 b{color:var(--f1)}
.ny small{color:var(--mut);font-size:12px}
.fl{font-size:22px;width:30px;text-align:center}
.spr{font-style:normal;font-size:10px;font-weight:800;border:1px solid var(--f1);color:var(--f1);padding:1px 5px;border-radius:3px;margin-left:8px;vertical-align:middle;text-transform:uppercase}

.ch2{clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);flex:1 1 0;min-width:0;padding:10px 2px;font-size:clamp(9.5px,2.9vw,12px);letter-spacing:0;white-space:nowrap;text-align:center}
#p-w .bar{flex-wrap:nowrap;gap:4px}
.chip,.tab,.ch2,.btn{transition:filter .15s}
@media (hover:hover){.chip:hover,.tab:hover,.ch2:hover,.btn:hover{filter:brightness(1.18)}}
@media (min-width:700px){.wrap{max-width:760px}}
@media (min-width:980px){
 .wrap{max-width:1180px;padding:26px 32px 50px}
 .tabs{max-width:560px}
 .hero{padding:28px 32px}.hero .t{font-size:28px}.hero .d{font-size:16px}
 #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
 #list .gp{margin-bottom:0}#list .empty{grid-column:1/-1}
 #y27 .gp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 #p-w .bar,#wmlist{max-width:780px}
 #p-n{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
 #p-n .nw{margin-bottom:0}#p-n .foot{grid-column:1/-1}
}
@media (min-width:1500px){.wrap{max-width:1500px}#list{grid-template-columns:repeat(3,minmax(0,1fr))}#p-n{grid-template-columns:repeat(3,minmax(0,1fr))}}

.tab{font-size:clamp(9px,2.75vw,11.5px);min-width:0;white-space:nowrap}
.rs{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--f1);border-radius:16px;margin-bottom:12px;overflow:hidden}
.rs>summary{list-style:none;cursor:pointer;padding:12px 14px;position:relative}
.rs>summary::-webkit-details-marker{display:none}
.rs>summary:after{content:"";position:absolute;right:14px;top:18px;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s}
.rs[open]>summary:after{transform:rotate(-135deg);top:22px}
.rh small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:block}
.rh b{font-size:16px;font-style:italic;text-transform:uppercase;font-weight:800;padding-right:22px;display:block}
.rk{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.rk i{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.rk em,.tr em{font-style:normal;color:var(--mut);font-size:12px}
.rb{border-top:1px solid var(--ln);padding:4px 14px 12px}
.rb h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--f1);font-style:italic}
.tr{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--ln);font-size:13px}
.tr:first-child{border-top:0}
.tr .p{width:24px;text-align:right;color:var(--mut);flex:none}
.tr .n{flex:1;min-width:0}.tr .n em{display:block}
.tr .t{font-variant-numeric:tabular-nums;text-align:right;font-size:12px;flex:none}
.tr .t.fl{color:#b84dff;font-weight:700}
.tr .pt{width:26px;text-align:right;font-weight:700;flex:none}
@media (min-width:980px){#p-r{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}#p-r .rs{margin-bottom:0}#p-r .foot,#p-r .nw{grid-column:1/-1}}

.rk{flex-direction:column;gap:8px}
.rb{padding:0 14px 6px}
.ss{border-top:1px solid var(--ln)}.ss:first-child{border-top:0}
.ss summary{list-style:none;cursor:pointer;padding:12px 24px 12px 0;position:relative}
.ss summary::-webkit-details-marker{display:none}
.ss summary b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--f1);font-style:italic;margin-bottom:3px}
.ss summary .sw{font-size:14px;display:block}
.ss summary .sw i{font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-right:6px}
.ss summary:after{content:"";position:absolute;right:4px;top:50%;margin-top:-6px;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s}
.ss[open] summary:after{transform:rotate(-135deg);margin-top:-2px}
.ss .tb{padding-bottom:10px}
.tabs{gap:6px}
.tab,.ch2{clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:10px 2px;font-size:clamp(10px,3vw,12.5px);letter-spacing:.3px;flex:1 1 0;min-width:0;white-space:nowrap;text-align:center}
#p-w .bar{gap:6px;flex-wrap:nowrap}

.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rtop .trk{margin-right:26px}
.rh b{padding-right:0}
.logo{text-align:center}.logo img{margin:0 auto}

/* ===== v14: modernes UI + Animationen ===== */
:root{interpolate-size:allow-keywords;--sh:0 12px 32px -16px rgba(0,0,0,.65);--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--sh:0 10px 28px -16px rgba(30,30,60,.3)}}
body{-webkit-font-smoothing:antialiased;background:radial-gradient(1200px 520px at 50% -180px,color-mix(in srgb,var(--f1) 16%,transparent),transparent 70%),var(--bg);background-repeat:no-repeat}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#p-t,#p-w,#p-n,#p-r{animation:fadeUp .38s var(--ease) both}
details::details-content{block-size:0;overflow:clip;opacity:0;transition:block-size .34s var(--ease),opacity .26s ease,content-visibility .34s allow-discrete}
details[open]::details-content{block-size:auto;opacity:1}
.rs>summary:after,.ss>summary:after{transition:transform .3s var(--ease),margin .3s var(--ease),top .3s var(--ease)}
.tabs{position:sticky;top:0;z-index:15;margin:0 -14px 16px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent);max-width:none}
.tab,.ch2,.chip{transition:background .2s ease,color .2s ease,transform .15s ease,filter .15s}
.tab.on,.ch2.on,.chip.on{background:linear-gradient(135deg,#ff2d20,#b50500);color:#fff}
.tab:active,.ch2:active,.chip:active,.btn:active{transform:scale(.95)}
.gp,.rs,.nw{border-radius:20px;box-shadow:var(--sh)}
.gp h2{padding:14px 16px}
.row{padding:11px 16px;transition:background .15s}
@media (hover:hover){.row:hover{background:color-mix(in srgb,var(--card2) 60%,transparent)}.rs>summary:hover,.ss>summary:hover{background:color-mix(in srgb,var(--card2) 45%,transparent)}}
.rs>summary{padding:14px 16px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.ss>summary{-webkit-tap-highlight-color:transparent}
.rb{padding:0 16px 8px}
.hero{border-radius:22px;box-shadow:var(--sh);padding:20px}
.hero .t{font-style:italic;text-transform:uppercase;font-weight:800;letter-spacing:.3px}
.cd{gap:8px}
.cd div{background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:9px 10px;min-width:62px}
.cd b{font-size:26px;font-weight:800}
.tag{border-radius:999px;padding:3px 9px;letter-spacing:.3px}
.btn{border-radius:999px;font-weight:600;transition:transform .15s,filter .15s}
.btn.pri{background:linear-gradient(135deg,#ff2d20,#b50500);border-color:transparent}
.ny .chk{border-radius:4px}
.modal{-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.modal.show{animation:fadeIn .2s ease both}
.modal.show .sheet{animation:sheetUp .32s var(--ease) both}
.sheet{border-radius:26px 26px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.6)}
.foot button{margin-top:10px}
@media (min-width:980px){.tabs{margin:0 -32px 20px;padding:12px 32px}.tab{flex:0 0 170px}.tabs{gap:8px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.tcr{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 20%,transparent),color-mix(in srgb,var(--tc) 3%,transparent) 78%);box-shadow:inset 4px 0 0 color-mix(in srgb,var(--tc) 70%,transparent)}
.tcr.t{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 34%,transparent),color-mix(in srgb,var(--tc) 6%,transparent) 80%);box-shadow:inset 5px 0 0 var(--tc)}
.row.tcr{padding-left:20px}
.row.tcr:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 28%,transparent),color-mix(in srgb,var(--tc) 8%,transparent) 80%)}
.tr.tcr{padding:7px 8px 7px 14px;margin:3px 0;border-top:0;border-radius:10px;box-shadow:inset 3px 0 0 color-mix(in srgb,var(--tc) 75%,transparent)}
.tr.tcr:first-child{margin-top:0}

.tcr,.tcr.t{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 22%,transparent),color-mix(in srgb,var(--tc) 4%,transparent) 78%);box-shadow:inset 4px 0 0 color-mix(in srgb,var(--tc) 80%,transparent)}
.tr.tcr{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--tc) 80%,transparent)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tcr.wh{--tc:#8d919c!important}}
</style>
</head>
