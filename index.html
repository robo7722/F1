<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 &amp; F2 · Zeiten in Deutschland</title>
<style>
:root{--bg:#0b0b0f;--card:#16161d;--card2:#1e1e28;--tx:#f2f2f5;--mut:#9a9aab;--ln:#2a2a36;--f1:#e10600;--f2:#2d7dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3f6;--card:#fff;--card2:#ececf2;--tx:#14141a;--mut:#666678;--ln:#dcdce6}}
:root[data-theme="dark"]{--bg:#0b0b0f;--card:#16161d;--card2:#1e1e28;--tx:#f2f2f5;--mut:#9a9aab;--ln:#2a2a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.5px}
h1 b{color:var(--f1)}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#e10600 0%,#7a0300 100%);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero.f2{background:linear-gradient(135deg,#2d7dff 0%,#112f73 100%)}
.hero small{opacity:.85;text-transform:uppercase;letter-spacing:1px;font-size:11px}
.hero .t{font-size:19px;font-weight:700;margin:4px 0}
.hero .d{opacity:.9;font-size:14px}
.cd{display:flex;gap:10px;margin-top:12px}
.cd div{background:rgba(0,0,0,.28);border-radius:10px;padding:8px 10px;min-width:58px;text-align:center}
.cd b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;text-transform:uppercase;opacity:.8}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.pri{background:var(--f1);border-color:var(--f1);color:#fff}
.sp{flex:1}
.gp{background:var(--card);border:1px solid var(--ln);border-radius:16px;margin-bottom:12px;overflow:hidden}
.gp h2{margin:0;padding:12px 14px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gp h2 span{font-size:12px;color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--ln)}
.row.past{opacity:.45}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;color:#fff;min-width:30px;text-align:center}
.tag.F1{background:var(--f1)}.tag.F2{background:var(--f2)}
.s{flex:1}.s b{display:block;font-size:15px}.s i{font-style:normal;font-size:12px;color:var(--mut)}
.tm{text-align:right;font-variant-numeric:tabular-nums}.tm b{display:block;font-size:17px}.tm span{font-size:12px;color:var(--mut)}
.ic{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 6px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab,.ch2{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.tab{flex:1}
.tab.on,.ch2.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.wx{padding:0 14px 12px;font-size:13px;color:var(--mut);line-height:1.5}.wx b{color:var(--tx)}
.nw{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.nw small{color:var(--mut);font-size:12px}.nw h3{margin:6px 0;font-size:16px}.nw p{margin:0;color:var(--mut);font-size:14px}
.pos{width:26px;font-weight:700;color:var(--mut)}
.foot{color:var(--mut);font-size:12px;margin-top:18px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.sheet input,.sheet select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--card2);color:var(--tx);font-size:16px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1;border-radius:12px;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1><b>F1</b> &amp; F2 Zeitplan</h1>
  <div class="sub">Alle Zeiten in deutscher Zeit (<span id="tz">MEZ/MESZ</span>)</div>
  <div class="tabs"><button class="tab on" data-k="t">Termine</button><button class="tab" data-k="w">Meisterschaft</button><button class="tab" data-k="n">News</button></div>
  <div id="p-t">
  <div id="hero"></div>
  <div class="bar">
    <button class="chip on" data-f="ALL">Alle</button>
    <button class="chip" data-f="F1">Formel 1</button>
    <button class="chip" data-f="F2">Formel 2</button>
  </div>
  <div id="list"></div>
  <div class="bar" style="margin-top:6px">
    <button class="btn" id="past">Vergangene zeigen</button>
    <span class="sp"></span>
    <button class="btn" id="edit">Bearbeiten</button>
  </div>
  <div class="bar" id="editbar" style="display:none">
    <button class="btn pri" id="add">+ Termin</button>
    <span class="sp"></span>
    <button class="btn" id="reset">Zurücksetzen</button>
  </div>
  </div>
  <div id="p-w" style="display:none"><div class="bar"><button class="ch2 on" data-w="f1d">F1 Fahrer</button><button class="ch2" data-w="f1t">F1 Teams</button><button class="ch2" data-w="f2d">F2 Fahrer</button><button class="ch2" data-w="f2t">F2 Teams</button></div><div id="wmlist"></div></div>
  <div id="p-n" style="display:none"></div>
  <div class="foot">Änderungen werden nur auf diesem Gerät gespeichert.<br>Zeiten ohne Gewähr – bei Änderungen der Veranstalter bitte anpassen.</div>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h3 id="mt">Termin</h3>
  <label>Serie</label>
  <select id="fs"><option>F1</option><option>F2</option></select>
  <label>Grand Prix / Ort</label>
  <input id="fg" placeholder="z. B. 🇺🇸 USA (Austin)">
  <label>Session</label>
  <input id="fn" list="sess" placeholder="z. B. Qualifying">
  <datalist id="sess"><option>Qualifying</option><option>Sprint-Qualifying</option><option>Sprint</option><option>Rennen</option><option>Feature Race</option><option>Sprint Race</option></datalist>
  <label>Datum &amp; Uhrzeit (deutsche Zeit)</label>
  <input id="fd" type="datetime-local">
  <div class="acts"><button class="btn" id="cancel">Abbrechen</button><button class="btn pri" id="save">Speichern</button></div>
</div></div>

["Okt.","F2","Câmara führt vor Tsolov","Nur sieben Punkte trennen die beiden. In Katar und Abu Dhabi sind noch 78 Punkte zu holen, die FIA erwartet beide Rennen wie geplant."]
];
var ev=[],filt="ALL",showPast=false,editing=false,editId=null;
function mk(a,i){return{id:"d"+i,s:a[0],g:a[1],n:a[2],t:Date.parse(a[3]),p:a[4]||0}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(Array.isArray(p)){ev=p;return}}}catch(e){}ev=DEF.map(mk)}
function store(){try{localStorage.setItem(KEY,JSON.stringify(ev))}catch(e){}}
function parts(ts){var o={};new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(ts).forEach(function(p){o[p.type]=p.value});return o}
function toInput(ts){var p=parts(ts);return p.year+"-"+p.month+"-"+p.day+"T"+p.hour+":"+p.minute}
function fromInput(v){var m=v.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);if(!m)return NaN;var base=Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5]);var g=base;for(var i=0;i<3;i++){var p=parts(g);g=base-(Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-g)}return g}

var fShort=new Intl.DateTimeFormat("de-DE",{timeZone:TZ,day:"numeric",month:"short"});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function vis(){var now=Date.now();return ev.filter(function(e){return(filt==="ALL"||e.s===filt)&&(showPast||e.t>=now-3*3600e3)}).sort(function(a,b){return a.t-b.t})}
function render(){
  var now=Date.now(),list=vis(),groups={},order=[];
  list.forEach(function(e){if(!groups[e.g]){groups[e.g]=[];order.push(e.g)}groups[e.g].push(e)});
  var h="";
  order.forEach(function(g){var a=groups[g],first=a[0].t,last=a[a.length-1].t;

    h+='<div class="gp"><h2>'+esc(g)+'<span>'+rng+'</span></h2>'+wxLine(g);
    a.forEach(function(e){var past=e.t<now;
      h+='<div class="row'+(past?" past":"")+'"><span class="tag '+e.s+'">'+e.s+'</span><div class="s"><b>'+esc(e.n)+'</b></div><div class="tm"><b>'+(e.p===2?'Zeit offen':fTime.format(e.t)+' Uhr')+'</b><span>'+fDay.format(e.t)+(e.p===1?' · vorläufig':'')+'</span></div>'+
      (editing?'<button class="ic" data-e="'+e.id+'">✎</button><button class="ic" data-x="'+e.id+'">✕</button>':'')+'</div>'});
    h+='</div>'});

function hero(){
